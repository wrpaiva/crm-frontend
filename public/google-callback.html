<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Calendar - Conectando...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .container {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .success { color: #22c55e; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <p id="message">Conectando ao Google Calendar...</p>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const msgEl = document.getElementById('message');
      const spinnerEl = document.getElementById('spinner');

      if (error) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Conexão cancelada ou erro: ' + error;
        setTimeout(() => window.close(), 3000);
        return;
      }

      if (!code || !state) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Parâmetros inválidos.';
        setTimeout(() => window.close(), 3000);
        return;
      }

      try {
        const apiBase = window.location.origin.includes('localhost')
          ? 'http://localhost:3000'
          : window.location.origin;

        const res = await fetch(
          apiBase + '/api/google/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state)
        );

        if (!res.ok) throw new Error('Erro ao salvar tokens');

        spinnerEl.style.display = 'none';
        msgEl.className = 'success';
        msgEl.textContent = 'Google Calendar conectado com sucesso!';

        if (window.opener) {
          window.opener.postMessage({ type: 'google-connected' }, '*');
        }
        setTimeout(() => window.close(), 1500);
      } catch (err) {
        spinnerEl.style.display = 'none';
        msgEl.className = 'error';
        msgEl.textContent = 'Erro ao conectar: ' + err.message;
        setTimeout(() => window.close(), 3000);
      }
    })();
  </script>
</body>
</html>
